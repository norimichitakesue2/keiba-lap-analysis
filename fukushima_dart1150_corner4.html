<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>福島ダ1150m 展開×ラップ×4角分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c10;--s1:#14141c;--s2:#1a1a26;--s3:#20202e;--bd:#28283c;--bd2:#34344a;--gold:#f0c040;--blue:#5b9cf6;--green:#56d08b;--orange:#f09050;--red:#e05555;--purple:#a080f0;--text:#ddddef;--muted:#6060a0;--muted2:#444466;--font:'Noto Sans JP',sans-serif;--mono:'DM Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5}
a{color:inherit}
.ph{background:var(--s1);border-bottom:2px solid var(--gold);padding:14px 22px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ph h1{font-size:16px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.ph p{font-size:11px;color:var(--muted)}
.ph a.back{font-size:11px;color:var(--muted);text-decoration:none;margin-right:4px}
.ph a.back:hover{color:var(--gold)}
.chip{background:var(--gold);color:#000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;font-family:var(--mono)}
.hint-bar{background:var(--s2);border-bottom:1px solid var(--bd);padding:6px 22px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.hint-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.hdot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.container{padding:14px 18px}
.dev-section{margin-bottom:20px;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.dev-summary{display:grid;grid-template-columns:170px 1fr;background:var(--s2);border-bottom:1px solid var(--bd)}
.dev-info{padding:12px 14px;border-right:1px solid var(--bd);display:flex;flex-direction:column;justify-content:center;gap:5px}
.dev-name{font-size:15px;font-weight:700;letter-spacing:.05em}
.dev-name.shunpatsu{color:#f0c040}
.dev-name.kinko{color:#5b9cf6}
.dev-name.jizoku{color:#56d08b}
.dev-name.mae{color:#f09050}
.dev-name.hptai{color:#e05555}
.dev-name.hpsho{color:#a080f0}
.dev-name.longsp{color:#e088c0}
.dev-name.kasoku{color:#50c0c0}
.dev-total-num{font-family:var(--mono);font-size:19px;font-weight:500;color:var(--text)}
.dev-meta{font-family:var(--mono);font-size:10px;color:var(--muted)}
.lap-tabs{display:flex;overflow-x:auto}
.lap-tab{flex:1 1 0;min-width:120px;padding:9px 10px;border-right:1px solid var(--bd);cursor:pointer;transition:background .12s;border-bottom:2px solid transparent;position:relative}
.lap-tab:last-child{border-right:none}
.lap-tab:hover{background:var(--s3)}
.lap-tab.active{background:var(--s3);border-bottom-color:var(--gold)}
.lt-name{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.07em;margin-bottom:4px}
.lt-win{font-family:var(--mono);font-size:14px;font-weight:500}
.lt-row{display:flex;align-items:baseline;gap:6px;margin-bottom:2px}
.lt-count{font-family:var(--mono);font-size:10px;color:var(--muted)}
.lt-results{font-family:var(--mono);font-size:9px;color:var(--muted)}
.lt-place{font-family:var(--mono);font-size:10px;color:var(--muted)}
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-left:4px;vertical-align:middle}
.detail-panel{display:none;padding:14px 16px;background:var(--s1);border-top:1px solid var(--bd)}
.detail-panel.open{display:block}
.dp-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.07em;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.dp-badge{font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:3px}
.dp-badge.ok{background:#1a3a1a;color:var(--green)}
.dp-badge.ng{background:#3a1a1a;color:var(--red)}
.dp-badge.pending{background:#1a1a2a;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:4px}
.bar-row{display:flex;align-items:center;gap:8px;height:22px}
.bl{font-family:var(--mono);font-size:10px;color:var(--muted);width:40px;text-align:right;flex-shrink:0}
.bt{flex:1 1 0;height:14px;background:var(--s2);border-radius:2px;overflow:hidden;max-width:280px}
.bf{height:100%;border-radius:2px}
.bm{display:flex;align-items:center;gap:7px;flex-shrink:0;width:70px}
.bw{font-family:var(--mono);font-size:11px;font-weight:500;width:38px;text-align:right}
.bn{font-family:var(--mono);font-size:10px;color:var(--muted);width:28px}
.br{font-family:var(--mono);font-size:9px;color:var(--muted)}
.no-data{font-size:11px;color:var(--muted);font-style:italic}
.ratebar{display:flex;align-items:center;gap:4px;margin:2px 0}.rb-lab{font-size:9px;color:#8a8ab0;width:22px;flex-shrink:0;white-space:nowrap}.rb-track{flex:1;min-width:24px;max-width:130px;height:7px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}.rb-fill{height:100%;border-radius:2px}.rb-val{font-family:monospace;font-size:10px;color:#cfcfe6;width:42px;text-align:right;flex-shrink:0}.rbc-row{display:flex;gap:6px;flex:1;min-width:0}.rbc-row .ratebar{margin:0;flex:1;min-width:0}.rbc-row .rb-track{max-width:none}.rbc-row .rb-lab{width:18px}.rbc-row .rb-val{width:40px}.rbc-col{display:flex;flex-direction:column;gap:1px;margin-top:3px}.rbc-col .ratebar{margin:0}</style>
<script>function rateBar(pct,kind){var v=parseFloat(pct)||0;var max=kind==='win'?25:50;var w=Math.min(100,Math.round(v/max*100));var col=kind==='win'?(v>=15?'#56d08b':v>=10?'#f0c040':v>=6?'#f09050':'#3a3a55'):(v>=30?'#56d08b':v>=20?'#f0c040':v>=12?'#f09050':'#3a3a55');var lab=kind==='win'?'勝率':'複勝';return '<div class="ratebar"><span class="rb-lab">'+lab+'</span><div class="rb-track"><div class="rb-fill" style="width:'+w+'%;background:'+col+'"></div></div><span class="rb-val">'+pct+'</span></div>';}</script>
</head>
<body>
<div class="ph">
  <a class="back" href="index.html">&#9664; 戻る</a>
  <h1>福島ダ1150m｜展開×ラップ×4角分析</h1>
  <span class="chip">169件 / 福島 ダ1150m</span>
  <p>netkeiba勝ち馬サーチより集計 ／ 上位3展開タイプ（合計 100.0%）を掲載</p>
</div>

<div class="hint-bar">
  <div class="hint-item"><span class="hdot" style="background:#a080f0"></span>ハイペース消耗戦 121件(71.6%)</div>
  <div class="hint-item"><span class="hdot" style="background:#e05555"></span>ハイペース耐久戦 32件(18.9%)</div>
  <div class="hint-item"><span class="hdot" style="background:#5b9cf6"></span>均衡戦 16件(9.5%)</div>
  <div class="hint-item" style="margin-left:auto">ラップタイプをクリックで 4角順位別成績を表示</div>
</div>

<div class="container" id="root"></div>

<script>
// ====== DATA ======
// 展開タイプ×個別ラップタイプごとの 4コーナー順位別成績
// {I:4角順位, T:件数, K:着度数, W:勝率%, D:連対率%, P:複勝率%}
const CORNER = {"ハイペース消耗戦_耐久型": [{"I": 15, "T": 1, "K": "0-0-0-1", "W": 0, "D": 0, "P": 0}, {"I": 16, "T": 1, "K": "0-0-0-1", "W": 0, "D": 0, "P": 0}], "ハイペース消耗戦_先行型": [{"I": 1, "T": 8, "K": "1-3-0-4", "W": 12.5, "D": 50, "P": 50}, {"I": 2, "T": 11, "K": "4-1-3-3", "W": 36.4, "D": 45.5, "P": 72.7}, {"I": 3, "T": 8, "K": "1-2-2-3", "W": 12.5, "D": 37.5, "P": 62.5}, {"I": 4, "T": 8, "K": "0-1-0-7", "W": 0, "D": 12.5, "P": 12.5}, {"I": 5, "T": 6, "K": "0-0-0-6", "W": 0, "D": 0, "P": 0}, {"I": 6, "T": 15, "K": "0-0-2-13", "W": 0, "D": 0, "P": 13.3}, {"I": 7, "T": 6, "K": "0-0-0-6", "W": 0, "D": 0, "P": 0}, {"I": 8, "T": 7, "K": "2-0-0-5", "W": 28.6, "D": 28.6, "P": 28.6}, {"I": 9, "T": 5, "K": "0-1-0-4", "W": 0, "D": 20, "P": 20}, {"I": 10, "T": 13, "K": "0-0-1-12", "W": 0, "D": 0, "P": 7.7}, {"I": 11, "T": 7, "K": "0-0-0-7", "W": 0, "D": 0, "P": 0}, {"I": 12, "T": 4, "K": "0-0-0-4", "W": 0, "D": 0, "P": 0}, {"I": 13, "T": 5, "K": "0-0-0-5", "W": 0, "D": 0, "P": 0}, {"I": 14, "T": 7, "K": "0-0-0-7", "W": 0, "D": 0, "P": 0}, {"I": 15, "T": 3, "K": "0-0-0-3", "W": 0, "D": 0, "P": 0}, {"I": 16, "T": 3, "K": "0-0-0-3", "W": 0, "D": 0, "P": 0}], "ハイペース消耗戦_持続型": [{"I": 14, "T": 1, "K": "0-0-0-1", "W": 0, "D": 0, "P": 0}, {"I": 15, "T": 1, "K": "0-0-0-1", "W": 0, "D": 0, "P": 0}, {"I": 16, "T": 1, "K": "0-0-0-1", "W": 0, "D": 0, "P": 0}], "ハイペース耐久戦_先行型": [{"I": 1, "T": 2, "K": "0-1-0-1", "W": 0, "D": 50, "P": 50}, {"I": 2, "T": 2, "K": "1-0-0-1", "W": 50, "D": 50, "P": 50}, {"I": 3, "T": 4, "K": "1-1-0-2", "W": 25, "D": 50, "P": 50}, {"I": 5, "T": 3, "K": "0-0-0-3", "W": 0, "D": 0, "P": 0}, {"I": 6, "T": 1, "K": "0-0-1-0", "W": 0, "D": 0, "P": 100}, {"I": 7, "T": 3, "K": "0-0-1-2", "W": 0, "D": 0, "P": 33.3}, {"I": 8, "T": 1, "K": "0-0-0-1", "W": 0, "D": 0, "P": 0}, {"I": 9, "T": 3, "K": "0-0-0-3", "W": 0, "D": 0, "P": 0}, {"I": 10, "T": 2, "K": "0-0-0-2", "W": 0, "D": 0, "P": 0}, {"I": 11, "T": 4, "K": "0-0-0-4", "W": 0, "D": 0, "P": 0}, {"I": 12, "T": 2, "K": "0-0-0-2", "W": 0, "D": 0, "P": 0}, {"I": 14, "T": 1, "K": "0-0-0-1", "W": 0, "D": 0, "P": 0}, {"I": 15, "T": 2, "K": "0-0-0-2", "W": 0, "D": 0, "P": 0}, {"I": 16, "T": 1, "K": "0-0-0-1", "W": 0, "D": 0, "P": 0}], "ハイペース耐久戦_持続型": [{"I": 16, "T": 1, "K": "0-0-0-1", "W": 0, "D": 0, "P": 0}], "均衡戦_先行型": [{"I": 1, "T": 1, "K": "0-0-1-0", "W": 0, "D": 0, "P": 100}, {"I": 2, "T": 1, "K": "1-0-0-0", "W": 100, "D": 100, "P": 100}, {"I": 3, "T": 3, "K": "0-1-0-2", "W": 0, "D": 33.3, "P": 33.3}, {"I": 6, "T": 1, "K": "0-0-0-1", "W": 0, "D": 0, "P": 0}, {"I": 7, "T": 2, "K": "0-0-0-2", "W": 0, "D": 0, "P": 0}, {"I": 9, "T": 2, "K": "0-0-0-2", "W": 0, "D": 0, "P": 0}, {"I": 11, "T": 1, "K": "0-0-0-1", "W": 0, "D": 0, "P": 0}, {"I": 12, "T": 1, "K": "0-0-0-1", "W": 0, "D": 0, "P": 0}, {"I": 14, "T": 3, "K": "0-0-0-3", "W": 0, "D": 0, "P": 0}], "均衡戦_持続型": [{"I": 12, "T": 1, "K": "0-0-0-1", "W": 0, "D": 0, "P": 0}]};

const DEV = [{"name": "ハイペース消耗戦", "cls": "hpsho", "total": 121, "pct": "71.6%", "results": "8-8-8-97", "winRate": "6.6%", "placeRate": "13.2%", "showRate": "19.8%", "laps": [{"name": "先行型", "total": 116, "results": "8-8-8-92", "winRate": "6.9%", "placeRate": "13.8%", "showRate": "20.7%"}, {"name": "持続型", "total": 3, "results": "0-0-0-3", "winRate": "0.0%", "placeRate": "0.0%", "showRate": "0.0%"}, {"name": "耐久型", "total": 2, "results": "0-0-0-2", "winRate": "0.0%", "placeRate": "0.0%", "showRate": "0.0%"}]}, {"name": "ハイペース耐久戦", "cls": "hptai", "total": 32, "pct": "18.9%", "results": "2-2-2-26", "winRate": "6.3%", "placeRate": "12.5%", "showRate": "18.8%", "laps": [{"name": "先行型", "total": 31, "results": "2-2-2-25", "winRate": "6.5%", "placeRate": "12.9%", "showRate": "19.4%"}, {"name": "持続型", "total": 1, "results": "0-0-0-1", "winRate": "0.0%", "placeRate": "0.0%", "showRate": "0.0%"}]}, {"name": "均衡戦", "cls": "kinko", "total": 16, "pct": "9.5%", "results": "1-1-1-13", "winRate": "6.3%", "placeRate": "12.5%", "showRate": "18.8%", "laps": [{"name": "先行型", "total": 15, "results": "1-1-1-12", "winRate": "6.7%", "placeRate": "13.3%", "showRate": "20.0%"}, {"name": "持続型", "total": 1, "results": "0-0-0-1", "winRate": "0.0%", "placeRate": "0.0%", "showRate": "0.0%"}]}];

// ====== RENDER ======
function barColor(p){
  if(p>=30) return "var(--green)";
  if(p>=20) return "var(--gold)";
  if(p>=10) return "var(--orange)";
  return "var(--muted2)";
}
function statusDot(p){
  if(p>=20) return "var(--green)";
  if(p>=10) return "var(--gold)";
  if(p>=5)  return "var(--orange)";
  return "var(--muted2)";
}
function barsHTML(list){
  if(!list || !list.length) return '<div class="no-data">データなし</div>';
  // Show up to 14 corner positions; cap bar width based on max T
  const maxT = Math.max(...list.map(x=>x.T));
  return list.map(row=>{
    const pct = Number(row.P);
    const barW = Math.round((row.T / maxT) * 100);
    const col = barColor(pct);
    return `<div class="bar-row">
      <span class="bl">${row.I}番手</span>
      <div class="bt"><div class="bf" style="width:${barW}%;background:${col}"></div></div>
      <span class="bm">
        <span class="bw">${row.P.toFixed(1)}%</span>
        <span class="bn">(${row.T})</span>
      </span>
      <span class="br">${row.K}｜勝 ${row.W.toFixed(1)}%／連 ${row.D.toFixed(1)}%</span>
    </div>`;
  }).join("");
}
function badge(pct){
  const v = parseFloat(pct);
  if(v>=20) return `<span class="dp-badge ok">${pct}</span>`;
  if(v>=10) return `<span class="dp-badge pending">${pct}</span>`;
  return `<span class="dp-badge ng">${pct}</span>`;
}

function render(){
  const root = document.getElementById('root');
  root.innerHTML = DEV.map((dev, di)=>{
    const lapTabs = dev.laps.map((lap, li)=>{
      const dot = statusDot(parseFloat(lap.showRate));
      return `<div class="lap-tab" data-dev="${di}" data-lap="${li}">
        <div class="lt-name">${lap.name}<span class="status-dot" style="background:${dot}"></span></div>
        <div class="lt-count">${lap.total}件</div>
        ${rateBar(lap.winRate,'win')}${rateBar(lap.showRate,'show')}
        <div class="lt-place">連対 ${lap.placeRate}　${lap.results}</div>
      </div>`;
    }).join("");
    const panels = dev.laps.map((lap, li)=>{
      const key = dev.name + "_" + lap.name;
      const data = CORNER[key] || [];
      return `<div class="detail-panel" data-dev="${di}" data-lap="${li}">
        <div class="dp-title">
          <span>${dev.name} × ${lap.name}　4コーナー順位別成績</span>
          ${badge(lap.showRate)}
          <span style="color:var(--muted);font-family:var(--mono);font-size:10px">n=${lap.total}</span>
        </div>
        <div class="bars">${barsHTML(data)}</div>
      </div>`;
    }).join("");
    return `<div class="dev-section">
      <div class="dev-summary">
        <div class="dev-info">
          <div class="dev-name ${dev.cls}">${dev.name}</div>
          <div class="dev-total-num">${dev.total.toLocaleString()}<span style="font-size:10px;color:var(--muted);margin-left:6px">件 ${dev.pct}</span></div>
          ${rateBar(dev.winRate,'win')}${rateBar(dev.showRate,'show')}
          <div class="dev-meta">連対率 ${dev.placeRate} ／ ${dev.results}</div>
        </div>
        <div class="lap-tabs">${lapTabs}</div>
      </div>
      ${panels}
    </div>`;
  }).join("");

  // Bind clicks
  root.querySelectorAll('.lap-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      const di = tab.dataset.dev, li = tab.dataset.lap;
      const section = tab.closest('.dev-section');
      const wasActive = tab.classList.contains('active');
      // Toggle
      section.querySelectorAll('.lap-tab').forEach(t=>t.classList.remove('active'));
      section.querySelectorAll('.detail-panel').forEach(p=>p.classList.remove('open'));
      if(!wasActive){
        tab.classList.add('active');
        const panel = section.querySelector(`.detail-panel[data-dev="${di}"][data-lap="${li}"]`);
        panel.classList.add('open');
      }
    });
  });

  // Auto-open first lap of each dev
  root.querySelectorAll('.dev-section').forEach(sec=>{
    const first = sec.querySelector('.lap-tab');
    if(first) first.click();
  });
}
render();
</script>
<script>/*rb-corner*/(function(){
function K(el){var m=el&&el.textContent&&el.textContent.match(/(\d+)-(\d+)-(\d+)-(\d+)/);return m?[+m[1],+m[2],+m[3],+m[4]]:null;}
function gauges(k,row){var tot=k[0]+k[1]+k[2]+k[3];if(tot<=0)return null;
 var win=(k[0]/tot*100).toFixed(1)+'%',show=((k[0]+k[1]+k[2])/tot*100).toFixed(1)+'%';
 var c=document.createElement(row?'span':'div');c.className=row?'rbc-row':'rbc-col';
 c.innerHTML=rateBar(win,'win')+rateBar(show,'show');return c;}
function run(){
 if(typeof rateBar!=='function')return;
 document.querySelectorAll('.bar-row').forEach(function(r){
  if(r.dataset.rbc)return;var br=r.querySelector('.br');var k=K(br)||K(r);if(!k)return;
  var g=gauges(k,true);if(!g)return;r.dataset.rbc='1';
  var bt=r.querySelector('.bt');if(bt)bt.replaceWith(g);else r.insertBefore(g,r.children[1]||null);
 });
 document.querySelectorAll('.jyuni-card').forEach(function(c){
  if(c.dataset.rbc)return;var k=K(c.querySelector('.jyuni-results'));if(!k)return;
  var g=gauges(k,false);if(!g)return;c.dataset.rbc='1';
  var rt=c.querySelector('.jyuni-rates');if(rt)rt.replaceWith(g);else c.appendChild(g);
 });
}
if(document.readyState!=='loading')setTimeout(run,150);else document.addEventListener('DOMContentLoaded',function(){setTimeout(run,150);});
document.addEventListener('click',function(){setTimeout(run,80);});
})();</script></body>
</html>
