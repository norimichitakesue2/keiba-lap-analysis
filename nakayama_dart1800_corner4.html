  if(p>=30) return "var(--green)";
  if(p>=20) return "var(--gold)";
  if(p>=10) return "var(--orange)";
  return "var(--muted2)";
}
function statusDot(p){
  if(p>=20) return "var(--green)";
  if(p>=10) return "var(--gold)";
  if(p>=5)  return "var(--orange)";
  return "var(--muted2)";
}
function barsHTML(list){
  if(!list || !list.length) return '<div class="no-data">データなし</div>';
  // Show up to 14 corner positions; cap bar width based on max T
  const maxT = Math.max(...list.map(x=>x.T));
  return list.map(row=>{
    const pct = Number(row.P);
    const barW = Math.round((row.T / maxT) * 100);
    const col = barColor(pct);
    return `<div class="bar-row">
      <span class="bl">${row.I}番手</span>
      <div class="bt"><div class="bf" style="width:${barW}%;background:${col}"></div></div>
      <span class="bm">
        <span class="bw">${row.P.toFixed(1)}%</span>
        <span class="bn">(${row.T})</span>
      </span>
      <span class="br">${row.K}｜勝 ${row.W.toFixed(1)}%／連 ${row.D.toFixed(1)}%</span>
    </div>`;
  }).join("");
}
const IDX = {};
const BINLAB=["〜59","60-69","70-79","80-89","90-99","100-109","110〜"];
const IDXLAB={zen:"全体",st:"スタート",ou:"追走",ri:"上がり"};
function barsIdxHTML(list){
  if(!list || !list.length) return '<div class="no-data">データなし</div>';
  const maxT = Math.max(...list.map(x=>x.T));
  return list.map(row=>{
    const k = row.K.split("-").map(Number);
    const tot = k[0]+k[1]+k[2]+k[3];
    const P = tot? (k[0]+k[1]+k[2])/tot*100 : 0;
    const W = tot? k[0]/tot*100 : 0;
    const D = tot? (k[0]+k[1])/tot*100 : 0;
    const barW = Math.round((row.T / maxT) * 100);
    return `<div class="bar-row">
      <span class="bl" style="width:56px">${BINLAB[row.B]}</span>
      <div class="bt"><div class="bf" style="width:${barW}%;background:${barColor(P)}"></div></div>
      <span class="bm">
        <span class="bw">${P.toFixed(1)}%</span>
        <span class="bn">(${row.T})</span>
      </span>
      <span class="br">${row.K}｜勝 ${W.toFixed(1)}%／連 ${D.toFixed(1)}%</span>
    </div>`;
  }).join("");
}
function binQuantile(counts,p){
  const LO=[50,60,70,80,90,100,110], HI=[60,70,80,90,100,110,120];
  const N=counts.reduce((a,b)=>a+b,0); if(!N) return null;
  const target=N*p; let c=0;
  for(let i=0;i<7;i++){
    if(counts[i]>0 && c+counts[i]>=target) return Math.round(LO[i]+((target-c)/counts[i])*(HI[i]-LO[i]));
    c+=counts[i];
  }
  return null;
}
function qCell(counts,cls){
  const m=binQuantile(counts,0.5);
  if(m===null) return `<span class="${cls}"><b>–</b></span>`;
  const q1=binQuantile(counts,0.25), q3=binQuantile(counts,0.75);
  const rng=(q1!==null&&q3!==null)?`${q1}–${q3}`:"";
  return `<span class="${cls}"><b>${m}</b><small>${rng}</small></span>`;
}
function idxSummaryHTML(key){
  const types=["zen","st","ou","ri"].filter(t=>IDX[key+"_"+t] && IDX[key+"_"+t].length);
  if(!types.length) return '<div class="no-data">データなし</div>';
  const head='<div class="ig-row ig-head"><span class="ig-lab"></span>'
    + BINLAB.map(b=>`<span class="ig-cell">${b}</span>`).join('')
    + '<span class="ig-med">勝ち馬<br>中央/四分位</span><span class="ig-med2">3着内<br>中央/四分位</span></div>';
  const rows=types.map(t=>{
    const byB={}; IDX[key+"_"+t].forEach(r=>byB[r.B]=r);
    const wins=BINLAB.map((_,i)=> byB[i]? Number(byB[i].K.split("-")[0]) : 0);
    const plc =BINLAB.map((_,i)=>{ if(!byB[i]) return 0; const k=byB[i].K.split("-").map(Number); return k[0]+k[1]+k[2]; });
    const tots=BINLAB.map((_,i)=> byB[i]? byB[i].T : 0);
    const W=wins.reduce((a,b)=>a+b,0);
    const cells=BINLAB.map((_,i)=>{
      const share = W? wins[i]/W : 0;
      const bg = wins[i]>0 ? `background:rgba(86,208,139,${(0.10+share*0.70).toFixed(2)})` : "";
      const wr = tots[i]>0 ? (wins[i]/tots[i]*100).toFixed(0)+"%" : "";
      return `<span class="ig-cell" style="${bg}" title="${tots[i]}頭中${wins[i]}勝"><b>${wins[i]||""}</b><i>${wr}</i></span>`;
    }).join("");
    return `<div class="ig-row"><span class="ig-lab">${IDXLAB[t]}</span>${cells}${qCell(wins,"ig-med")}${qCell(plc,"ig-med2")}</div>`;
  }).join("");
  return `<div class="idx-grid">${head}${rows}</div>`
    + '<div class="idx-note">上段=勝ち馬の頭数（濃さ＝勝ち馬がどのビンに集中しているか）／下段=そのビンの勝率。右2列は中央値と四分位範囲(Q1–Q3)で、<b>Q1が「この水準は要る」の目安、Q3を超えれば余裕</b>。※指数は当該レースでの記録値</div>';
}
function badge(pct){
  const v = parseFloat(pct);
  if(v>=20) return `<span class="dp-badge ok">${pct}</span>`;
  if(v>=10) return `<span class="dp-badge pending">${pct}</span>`;
  return `<span class="dp-badge ng">${pct}</span>`;
}

const PROF = {};
const PROFD = {};
const OTH={zen:["st","ou","ri"],st:["zen","ou","ri"],ou:["zen","st","ri"],ri:["zen","st","ou"]};
function profTable(d, base){
  const rows=(d.byBase||{})[base]||[];
  if(!rows.length) return '<div class="no-data">この基準指数では十分なサンプルがありません</div>';
  const oth=OTH[base];
  const head=`<div class="pf-row pf-tab"><span class="pf-c0">${IDXLAB[base]}指数</span><span class="pf-cn">n</span>`
    + oth.map(o=>`<span class="pf-cv">${IDXLAB[o]}</span>`).join('') + '</div>';
  const warn = d.n<30 ? `<div class="pf-warn">⚠ 母数 n=${d.n} と小さいため参考値です</div>` : "";
  return head + rows.map(r=>`<div class="pf-row">
    <span class="pf-c0">${BINLAB[r.b]}</span>
    <span class="pf-cn">${r.n}頭</span>
    ${r.m.map(v=>`<span class="pf-cv">${v===null||v==="-"?"–":v}</span>`).join('')}
  </div>`).join('') + warn;
}
function profHTML(dev, lap){
  let d=PROFD[dev+"|"+lap], src="dev";
  if(!d){ d=PROF[lap]; src="all"; }
  if(!d) return null;
  const bases=["zen","st","ou","ri"].filter(b=>(d.byBase||{})[b] && d.byBase[b].length);
  if(!bases.length) return null;
  const first=bases[0];
  const note = src==="dev"
    ? `この展開タイプ（${dev}）× ${lap} で3着内に来た ${d.n}頭 が対象`
    : `この展開タイプは母数不足のため、<b>全展開</b>の ${lap}（3着内 ${d.n}頭）で集計`;
  return `<div class="prof-inline">
    <div class="prof-sub">基準にした指数のビンごとに、同じ馬たちの他3指数の中央値。${note}。各ビン n≧8 のみ表示。<br>読み方：スタート100-109の行 →「スタート指数が100台だった馬は、全体○○・追走○○・上がり○○くらい」</div>
    <div class="prof-grp" style="margin:8px 0 6px"><em>基準指数</em>${bases.map(b=>`<span class="pt ${b===first?'active':''}" data-pb="${b}">${IDXLAB[b]}</span>`).join('')}</div>
    ${bases.map(b=>`<div class="pf-panel" data-pv="${b}" ${b===first?'':'hidden'}>${profTable(d,b)}</div>`).join('')}
  </div>`;
}
function render(){
  const root = document.getElementById('root');
  root.innerHTML = DEV.map((dev, di)=>{
    const lapTabs = dev.laps.map((lap, li)=>{
      const dot = statusDot(parseFloat(lap.showRate));
      return `<div class="lap-tab" data-dev="${di}" data-lap="${li}">
        <div class="lt-name">${lap.name}<span class="status-dot" style="background:${dot}"></span></div>
        <div class="lt-count">${lap.total}件</div>
        ${rateBar(lap.winRate,'win')}${rateBar(lap.showRate,'show')}
        <div class="lt-place">連対 ${lap.placeRate}　${lap.results}</div>
      </div>`;
    }).join("");
    const panels = dev.laps.map((lap, li)=>{
      const key = dev.name + "_" + lap.name;
      const data = CORNER[key] || [];
      const idxTypes = ["zen","st","ou","ri"].filter(t=>IDX[key+"_"+t] && IDX[key+"_"+t].length);
      const prof = profHTML(dev.name, lap.name);
      const tabs = ['<span class="sub-tab active" data-v="corner">4角順位</span>']
        .concat(idxTypes.length?['<span class="sub-tab" data-v="idxsum">指数水準（4指数同時）</span>']:[])
        .concat(prof?['<span class="sub-tab" data-v="prof">指数プロファイル</span>']:[])
        .concat(idxTypes.map(t=>`<span class="sub-tab" data-v="${t}">${IDXLAB[t]}指数</span>`)).join("");
      const views = [`<div class="sub-view" data-v="corner"><div class="bars">${barsHTML(data)}</div></div>`]
        .concat(idxTypes.length?[`<div class="sub-view" data-v="idxsum" hidden>${idxSummaryHTML(key)}</div>`]:[])
        .concat(prof?[`<div class="sub-view" data-v="prof" hidden>${prof}</div>`]:[])
        .concat(idxTypes.map(t=>{
          const rows = IDX[key+"_"+t];
          const n = rows.reduce((a,r)=>a+r.T,0);
          return `<div class="sub-view" data-v="${t}" hidden>
            <div class="idx-note">タイム指数マスター（${IDXLAB[t]}）別 ／ 指数取得済み n=${n}　※指数は当該レースでの記録値</div>
            <div class="bars">${barsIdxHTML(rows)}</div>
          </div>`;
        })).join("");
      return `<div class="detail-panel" data-dev="${di}" data-lap="${li}">
        <div class="dp-title">
          <span>${dev.name} × ${lap.name}</span>
          ${badge(lap.showRate)}
          <span style="color:var(--muted);font-family:var(--mono);font-size:10px">n=${lap.total}</span>
        </div>
        <div class="sub-tabs">${tabs}</div>
        ${views}
      </div>`;
    }).join("");
    return `<div class="dev-section">
      <div class="dev-summary">
        <div class="dev-info">
          <div class="dev-name ${dev.cls}">${dev.name}</div>
          <div class="dev-total-num">${dev.total.toLocaleString()}<span style="font-size:10px;color:var(--muted);margin-left:6px">件 ${dev.pct}</span></div>
          ${rateBar(dev.winRate,'win')}${rateBar(dev.showRate,'show')}
          <div class="dev-meta">連対率 ${dev.placeRate} ／ ${dev.results}</div>
        </div>
        <div class="lap-tabs">${lapTabs}</div>
      </div>
      ${panels}
    </div>`;
  }).join("");

  // Bind clicks
  root.querySelectorAll('.lap-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      const di = tab.dataset.dev, li = tab.dataset.lap;
      const section = tab.closest('.dev-section');
      const wasActive = tab.classList.contains('active');
      // Toggle
      section.querySelectorAll('.lap-tab').forEach(t=>t.classList.remove('active'));
      section.querySelectorAll('.detail-panel').forEach(p=>p.classList.remove('open'));
      if(!wasActive){
        tab.classList.add('active');
        const panel = section.querySelector(`.detail-panel[data-dev="${di}"][data-lap="${li}"]`);
        panel.classList.add('open');
      }
    });
  });

  // 指数プロファイルの基準指数ピル
  root.querySelectorAll('.pt[data-pb]').forEach(p=>{
    p.addEventListener('click', e=>{
      e.stopPropagation();
      const box=p.closest('.prof-inline'); const b=p.dataset.pb;
      box.querySelectorAll('.pt[data-pb]').forEach(x=>x.classList.toggle('active', x===p));
      box.querySelectorAll('.pf-panel').forEach(x=>{ x.hidden = (x.dataset.pv !== b); });
    });
  });

  // Sub-tab (4角 / 指数) switching
  root.querySelectorAll('.sub-tab').forEach(st=>{
    st.addEventListener('click', e=>{
      e.stopPropagation();
      const panel = st.closest('.detail-panel');
      const v = st.dataset.v;
      panel.querySelectorAll('.sub-tab').forEach(x=>x.classList.toggle('active', x===st));
      panel.querySelectorAll('.sub-view').forEach(x=>{ x.hidden = (x.dataset.v !== v); });
    });
  });

  // Auto-open first lap of each dev
  root.querySelectorAll('.dev-section').forEach(sec=>{
    const first = sec.querySelector('.lap-tab');
    if(first) first.click();
  });
}
render();
</script>
<script>/*rb-corner*/(function(){
function K(el){var m=el&&el.textContent&&el.textContent.match(/(\d+)-(\d+)-(\d+)-(\d+)/);return m?[+m[1],+m[2],+m[3],+m[4]]:null;}
function gauges(k,row){var tot=k[0]+k[1]+k[2]+k[3];if(tot<=0)return null;
 var win=(k[0]/tot*100).toFixed(1)+'%',show=((k[0]+k[1]+k[2])/tot*100).toFixed(1)+'%';
 var c=document.createElement(row?'span':'div');c.className=row?'rbc-row':'rbc-col';
 c.innerHTML=rateBar(win,'win')+rateBar(show,'show');return c;}
function run(){
 if(typeof rateBar!=='function')return;
 document.querySelectorAll('.bar-row').forEach(function(r){
  if(r.dataset.rbc)return;var br=r.querySelector('.br');var k=K(br)||K(r);if(!k)return;
  var g=gauges(k,true);if(!g)return;r.dataset.rbc='1';
  var bt=r.querySelector('.bt');if(bt)bt.replaceWith(g);else r.insertBefore(g,r.children[1]||null);
 });
 document.querySelectorAll('.jyuni-card').forEach(function(c){
  if(c.dataset.rbc)return;var k=K(c.querySelector('.jyuni-results'));if(!k)return;
  var g=gauges(k,false);if(!g)return;c.dataset.rbc='1';
  var rt=c.querySelector('.jyuni-rates');if(rt)rt.replaceWith(g);else c.appendChild(g);
 });
}
if(document.readyState!=='loading')setTimeout(run,150);else document.addEventListener('DOMContentLoaded',function(){setTimeout(run,150);});
document.addEventListener('click',function(){setTimeout(run,80);});
})();</script></body>
</html>
